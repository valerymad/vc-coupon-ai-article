<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Coupon AI — обложка статьи на VC</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Manrope'; font-weight: 500; font-display: block;
        src: url('assets/fonts/manrope-500-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Manrope'; font-weight: 500; font-display: block;
        src: url('assets/fonts/manrope-500-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 600; font-display: block;
        src: url('assets/fonts/manrope-600-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Manrope'; font-weight: 600; font-display: block;
        src: url('assets/fonts/manrope-600-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 700; font-display: block;
        src: url('assets/fonts/manrope-700-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Manrope'; font-weight: 700; font-display: block;
        src: url('assets/fonts/manrope-700-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 800; font-display: block;
        src: url('assets/fonts/manrope-800-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Manrope'; font-weight: 800; font-display: block;
        src: url('assets/fonts/manrope-800-latin.woff2') format('woff2'); }
      @font-face { font-family: 'JBMono'; font-weight: 500; font-display: block;
        src: url('assets/fonts/jbmono-500-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'JBMono'; font-weight: 500; font-display: block;
        src: url('assets/fonts/jbmono-500-latin.woff2') format('woff2'); }
      @font-face { font-family: 'JBMono'; font-weight: 700; font-display: block;
        src: url('assets/fonts/jbmono-700-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'JBMono'; font-weight: 700; font-display: block;
        src: url('assets/fonts/jbmono-700-latin.woff2') format('woff2'); }

      :root {
        --ink: #0b0b0f;
        --grey: #6b7280;
        --indigo: #495bf6;
        --red: #f03c41;
        --ink2: #3f4654;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      body { font-family: 'Manrope', sans-serif; color: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      .scene { position: absolute; inset: 0; }
      .bg { position: absolute; inset: 0; background: #ffffff; }
      .blob {
        position: absolute; width: 940px; height: 940px; right: -250px; bottom: -350px;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 42%, rgba(73, 91, 246, 0.22), rgba(73, 91, 246, 0) 68%);
      }

      /* ---------- левая колонка ---------- */
      .left { position: absolute; left: 104px; top: 200px; width: 880px; }
      .eyebrow {
        font-family: 'JBMono', monospace; font-weight: 700; font-size: 24px;
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--indigo);
      }
      .h1 { font-size: 78px; font-weight: 800; line-height: 1.05; letter-spacing: -0.025em; margin-top: 30px; }
      .rule { width: 132px; height: 8px; background: var(--red); border-radius: 4px; margin: 44px 0 30px; }
      .h2list { display: flex; flex-direction: column; gap: 18px; }
      .h2list div { display: flex; align-items: center; gap: 24px; font-size: 40px; font-weight: 600; line-height: 1.3; color: var(--ink2); }
      .h2list i { display: block; width: 13px; height: 13px; border-radius: 4px; background: var(--indigo); flex: 0 0 13px; }
      .spec {
        font-family: 'JBMono', monospace; font-weight: 700; font-size: 34px;
        letter-spacing: 0.04em; color: var(--indigo); margin-top: 40px;
      }

      .foot { position: absolute; left: 104px; bottom: 92px; display: flex; align-items: center; gap: 30px; }
      .foot img { height: 46px; width: auto; display: block; }
      .foot .u {
        font-family: 'JBMono', monospace; font-weight: 500; font-size: 26px;
        color: var(--grey); letter-spacing: 0.04em;
      }

      /* ---------- правая часть ---------- */
      .shot {
        position: absolute; left: 1108px; top: 64px; width: 712px; height: 626px;
        filter: drop-shadow(0 34px 60px rgba(11, 11, 15, 0.18));
      }
      .shot img { width: 712px; height: 626px; display: block; border-radius: 22px; }

      .cta {
        position: absolute; left: 1004px; top: 828px; width: 566px; height: 118px;
        background: var(--indigo); border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;
        box-shadow: 0 22px 44px rgba(73, 91, 246, 0.32);
      }
      .cursor { position: absolute; left: 1448px; top: 872px; width: 92px; height: 122px; }
      .stamp {
        position: absolute; left: 1270px; top: 688px; width: 470px; height: 130px;
        border: 9px solid var(--red); border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255, 255, 255, 0.93);
        font-size: 58px; font-weight: 800; letter-spacing: 0.05em; color: var(--red);
        transform: rotate(-7deg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="bg"></div>
        <div class="blob"></div>

        <div class="left">
          <!-- бренд-эйрбоу снят под правила VC
          <div class="eyebrow" id="cv-eye">Cupcake Development &#183; Coupon AI</div>
          -->
          <div class="h1" id="cv-h1">ИИ чуть не оформил заказ за пользователя</div>
          <div class="rule" id="cv-rule"></div>
          <div class="h2list" id="cv-h2">
            <div><i></i>Что пришлось ему запретить</div>
            <div><i></i>На какие подводные камни напоролись</div>
            <div><i></i>Как оптимизировали затраты и скорость</div>
          </div>
          <div class="spec" id="cv-spec">3 истории, 5 уровней, 8 выводов</div>
        </div>

        <div class="shot" id="cv-shot">
          <img src="assets/product-card.png" alt="Панель Coupon AI перебирает промокоды в корзине" />
        </div>

        <div class="cta" id="cv-cta">Continue to checkout</div>

        <div class="cursor" id="cv-cursor">
          <svg width="92" height="122" viewBox="0 0 46 61" aria-hidden="true">
            <path
              d="M5 3 L5 47 L16.5 36.5 L24 53 L33 49 L25.6 32.8 L40 32.8 Z"
              fill="#0b0b0f"
              stroke="#ffffff"
              stroke-width="3.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div class="stamp" id="cv-stamp">так нельзя</div>

        <!-- подвал с лого и доменом снят под правила VC
        <div class="foot" id="cv-foot">
          <img src="assets/LOGO-CCDEV.png" alt="Cupcake Development" />
          <div class="u">coupons.cupcakedev.com</div>
        </div>
        -->
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('#cv-h1', { opacity: 0, y: 34, duration: 0.6, ease: 'power3.out' }, 0.25);
      tl.from('#cv-rule', { opacity: 0, duration: 0.4, ease: 'power2.out' }, 0.55);
      tl.from('#cv-h2', { opacity: 0, y: 22, duration: 0.5, ease: 'power3.out' }, 0.65);
      tl.from('#cv-spec', { opacity: 0, y: 18, duration: 0.45, ease: 'power3.out' }, 0.85);
      tl.from('#cv-shot', { opacity: 0, x: 60, duration: 0.7, ease: 'power3.out' }, 0.3);
      tl.from('#cv-cta', { opacity: 0, y: 30, duration: 0.5, ease: 'power3.out' }, 0.8);
      tl.from('#cv-cursor', { opacity: 0, y: 26, duration: 0.4, ease: 'power3.out' }, 1.0);
      tl.from('#cv-stamp', { opacity: 0, duration: 0.35, ease: 'power2.out' }, 1.2);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
